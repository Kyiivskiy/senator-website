name: Keep backend awake

# Render's free tier puts the service to sleep after ~15 minutes of silence,
# and the next request then waits 30-60s for a cold start. A lead form cannot
# afford that, so this pings the health endpoint often enough to keep it warm.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          code=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 90 \
            https://senator-backend.onrender.com/api/health)
          echo "HTTP $code"
          cat /tmp/body.txt
          test "$code" = "200"
