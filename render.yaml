services:
  - type: web
    name: senator-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ORDER_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://kyiivskiy.github.io
